log:
  level: error

api:
  http: "127.0.0.1:{API_PORT}"

plugins:
  - tag: fwd
    type: forward
    args:
      upstreams:
        - addr: "udp://127.0.0.1:15453"

  - tag: cache_main
    type: cache
    args:
      size: 1024
      dump_file: "cache/cache.dump"
      dump_interval: 60

  - tag: lazy_cache
    type: feature_flag
    args:
      label: 过期缓存
      description: 只用于测试 check 不写文件
      section: cache
      kind: bool
      default: true

  - tag: entry
    type: sequence
    args:
      - matches: flag lazy_cache
        exec: $cache_main
      - exec: $fwd

  - tag: udp_in
    type: udp_server
    args:
      entry: entry
      listen: "127.0.0.1:{DNS_PORT}"
      enable_audit: false
