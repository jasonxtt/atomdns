[package]
name = "atomdns-cache-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "atomdns_cache_core"
crate-type = ["rlib"]

[dependencies]
# Bounded concurrent store (CLOCK-PRO, MIT). No default features: the bundled
# foldhash hasher would add a crate, and std SipHash matches the former store.
quick_cache = { version = "=0.7.0", default-features = false, features = ["parking_lot"] }

[lints]
workspace = true
