name: Build the Docker image

# The image follows releases, not commits to main: online updates and the image both ship what a
# GitHub Release carries, so publishing a release `vX.Y.Z` (release-build.yml artifacts, checked,
# then `gh release create`) builds and pushes jasonxtt/atomdns:vX.Y.Z and :latest by itself.
# Nothing is compiled here: scripts/build-docker-image.sh wraps the release's files.
#
# Manual runs (Actions tab, or `gh workflow run docker-image.yml -f tag=vX.Y.Z`) rebuild a tag, for
# example when the release gained a file (config_rust.zip) after it was published. `push` is off by
# default there: the image is then built for amd64 only and discarded after a smoke test.
# Pushing needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) whose assets go into the image
        required: true
      push:
        description: Push jasonxtt/atomdns:<tag> (multi-arch) to Docker Hub
        type: boolean
        default: false
      latest:
        description: Also push the latest tag
        type: boolean
        default: false

jobs:
  image:
    # Draft and pre-release publications, and tags that are not vX.Y.Z, never reach the image.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.prerelease && !github.event.release.draft &&
       startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUSH: ${{ github.event_name == 'release' && '1' || (inputs.push && '1' || '0') }}
      LATEST: ${{ github.event_name == 'release' && '1' || (inputs.latest && '1' || '0') }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: ${{ env.PUSH == '1' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-docker-image.sh "${TAG}"
      - name: Smoke test the amd64 image
        if: ${{ env.PUSH != '1' }}
        run: |
          docker run --rm "jasonxtt/atomdns:${TAG}" version
      - name: Check the pushed image
        if: ${{ env.PUSH == '1' }}
        run: |
          docker run --rm --platform linux/amd64 "jasonxtt/atomdns:${TAG}" version
          docker buildx imagetools inspect "jasonxtt/atomdns:latest"
      - name: Update the Docker Hub overview
        if: ${{ env.PUSH == '1' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: scripts/sync-dockerhub-readme.sh
